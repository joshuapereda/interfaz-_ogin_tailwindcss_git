<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .serif { font-family: 'DM Serif Display', serif; }
    input:focus { outline: none; border-color: #7F77DD; box-shadow: 0 0 0 3px #EEEDFE; }
    .btn-main:hover { background: #7F77DD; }
    .btn-main:active { transform: scale(0.98); }
    .social-btn:hover { border-color: #b0aec0; background: #fff; }
    .accent-bar {
      width: 32px; height: 3px;
      background: linear-gradient(90deg, #534AB7, #AFA9EC);
      border-radius: 2px;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center px-4">

  <div class="bg-white border border-gray-200 rounded-2xl p-10 w-full max-w-md shadow-sm">

    <!-- Accent bar -->
    <div class="accent-bar mb-5"></div>

    <!-- Header -->
    <p class="serif text-3xl text-gray-900 tracking-tight mb-1">
      Bien<em class="text-indigo-500">venido</em>
    </p>
    <p class="serif text-3xl text-gray-900 tracking-tight mb-1">
      Jos<em class="text-indigo-500">hua</em>
    </p>
    <p class="text-sm text-gray-400 font-light mb-8">Inicia sesión para continuar</p>

    <!-- Email -->
    <div class="mb-5">
      <label class="block text-xs font-medium text-gray-400 uppercase tracking-widest mb-1.5">
        Correo electrónico
      </label>
      <input
        type="email"
        placeholder="tu@correo.com"
        class="w-full h-11 px-4 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-900 transition-all duration-150"
      />
    </div>

    <!-- Password -->
    <div class="mb-5">
      <label class="block text-xs font-medium text-gray-400 uppercase tracking-widest mb-1.5">
        Contraseña
      </label>
      <input
        type="password"
        placeholder="••••••••"
        class="w-full h-11 px-4 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-900 transition-all duration-150"
      />
    </div>

    <!-- Remember & Forgot -->
    <div class="flex items-center justify-between mb-6">
      <label class="flex items-center gap-2 text-sm text-gray-500 cursor-pointer">
        <input type="checkbox" class="accent-[#7F77DD] w-4 h-4" />
        Recordarme
      </label>
      <a href="#" class="text-sm text-indigo-500 hover:underline">¿Olvidaste tu contraseña?</a>
    </div>

    <!-- Submit -->
    <button class="btn-main w-full h-11 bg-[#534AB7] text-white rounded-lg text-sm font-medium tracking-wide transition-all duration-150">
      Iniciar sesión
    </button>

    <!-- Divider -->
    <div class="flex items-center gap-3 my-6 text-xs text-gray-300">
      <span class="flex-1 h-px bg-gray-200"></span>
      o continúa con
      <span class="flex-1 h-px bg-gray-200"></span>
    </div>

    <!-- Social buttons -->
    <div class="grid grid-cols-2 gap-3">
      <!-- Google -->
      <button class="social-btn flex items-center justify-center gap-2 h-11 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700 transition-all duration-150">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google
      </button>

      <!-- GitHub -->
      <button class="social-btn flex items-center justify-center gap-2 h-11 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700 transition-all duration-150">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.477 2 2 6.477 2 12c0 4.419 2.865 8.166 6.839 9.489.5.09.682-.218.682-.484 0-.236-.009-.866-.013-1.699-2.782.602-3.369-1.34-3.369-1.34-.455-1.157-1.11-1.465-1.11-1.465-.909-.62.069-.608.069-.608 1.004.071 1.532 1.03 1.532 1.03.892 1.529 2.341 1.087 2.912.831.091-.646.349-1.086.635-1.337-2.22-.251-4.555-1.111-4.555-4.943 0-1.091.39-1.984 1.03-2.682-.103-.254-.447-1.27.097-2.646 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.376.202 2.394.1 2.646.64.699 1.026 1.591 1.026 2.682 0 3.841-2.337 4.687-4.565 4.935.359.307.679.917.679 1.852 0 1.335-.012 2.415-.012 2.741 0 .269.18.579.688.481C19.138 20.161 22 16.416 22 12c0-5.523-4.477-10-10-10z"/>
        </svg>
        GitHub
      </button>
    </div>

    <!-- Footer -->
    <p class="mt-8 text-center text-sm text-gray-400">
      ¿No tienes cuenta? <a href="#" class="text-indigo-500 hover:underline">Regístrate gratis</a>
    </p>

  </div>

</body>
</html>
